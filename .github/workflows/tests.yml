name: tests

# The two hermetic suites: no network, no credentials, no agent runner. They
# spawn the real server against fixture trees, so they exercise the paths that
# have actually broken here - live-run detection and the statusline reading -
# rather than a mocked stand-in.
#
# The end-to-end probe (test/activity-probe.workflow.js) is deliberately not
# here: it needs an agent runner and spends real tokens.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows is the platform this is developed and run on; ubuntu catches
        # the path and line-ending assumptions that are easy to make on it.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check
        run: |
          node --check usage-server/server.js
          node --check usage-server/official.js
          node --check usage-server/statusline.js
          node --check usage-server/statusline-tee.js
          node --check usage-server/usagehtml.js
          node --check ClaudeUsage/scripts/widget.js
          node --check C64Weather/scripts/widget.js
          node --check C64Weather/scripts/petscii.js
      - name: live detection
        run: node usage-server/test/live-detection.test.js
      - name: statusline and credentials
        run: node usage-server/test/statusline.test.js
      - name: stats
        run: node usage-server/test/stats.test.js
      - name: http request handling
        run: node usage-server/test/http.test.js
      - name: c64 font and art
        run: node C64Weather/test/font.test.js
      - name: c64 theme cycling
        run: node C64Weather/test/theme.test.js
      # The only suite here that looks at the widget instead of reading it: it
      # renders all seven themes headless at 840x344 and measures the real boxes,
      # which is the class of check the three visual defects that reached the
      # device all slipped past. It needs a Chrome-family browser, preinstalled
      # on both runner images; set CHROME_PATH to point it somewhere else. Chrome
      # writes its profile to the OS temp directory, never into the checkout.
      - name: c64 layout and scaling
        run: node C64Weather/test/layout.test.js
      # Same approach as the c64 suite above, for the usage widget: renders its
      # four views (plus the two stats-availability fixtures) headless at
      # 840x344 and measures the real boxes. Scroll-aware - .cols .col and
      # .list ul are deliberately scrolling containers, so a descendant of one
      # is allowed to extend past it; the scroller's own box is still checked.
      - name: usage widget layout
        run: node ClaudeUsage/test/layout.test.js
